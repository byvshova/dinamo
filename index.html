<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Привет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6EFFA; --card:#FFFFFF; --ink:#2A1840; --line:#E1D2F0;
  --accent:#7A3FD1; --on-accent:#FFFFFF; --soft:#EFE3FA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#170F24; --card:#231736; --ink:#F1E8FB; --line:#3A2858;
    --accent:#B58BFF; --on-accent:#1B1030; --soft:#2E1F47;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#170F24; --card:#231736; --ink:#F1E8FB; --line:#3A2858;
  --accent:#B58BFF; --on-accent:#1B1030; --soft:#2E1F47;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:18px; line-height:1.45;
  display:flex; align-items:center; justify-content:center; padding:24px 16px;
}
main{width:100%; max-width:520px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:20px;
  padding:32px 24px; text-align:center;
}
.q{font-size:1.6rem; line-height:1.25; font-weight:700; margin:0 0 24px}
.answers{display:flex; flex-direction:column; gap:10px}
button{
  font:inherit; font-weight:500; padding:14px 20px; border-radius:14px; cursor:pointer;
  border:1.5px solid var(--accent); background:var(--soft); color:var(--ink);
  transition:background .15s, color .15s;
}
button:hover{background:var(--accent); color:var(--on-accent)}
button:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.final{font-size:1.7rem; line-height:1.35; font-weight:700; margin:0; animation:pop .6s ease-out}
.card.has-cat{padding-bottom:0; overflow:hidden}
.cat{display:block; width:62%; max-width:300px; height:auto; margin:22px auto 0; animation:peek .7s .35s ease-out both}
@keyframes peek{from{opacity:0; transform:translateY(40px)} to{opacity:1; transform:none}}
@keyframes pop{from{opacity:0; transform:scale(.94)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){ .final,.cat{animation:none} }
</style>
</head>

let i = 0;
const card = document.getElementById("card");

function show(){
  const s = steps[i];
  card.replaceChildren();
  if (s.final){
    const p = document.createElement("p");
    p.className = "final";
    p.textContent = s.final;
    const img = document.createElement("img");
    img.className = "cat";
    img.alt = "Милый котик с румяными щёчками";

    b.textContent = t;
    b.addEventListener("click", () => { i++; show(); });
    box.append(b);
  });
  card.append(h, box);
  box.querySelector("button").focus({preventScroll:true});
}
